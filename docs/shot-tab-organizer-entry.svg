<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <!-- Mockup of the entry form with the reorganized layout: rows at their widths and labelled dividers -->
  <rect width="1200" height="720" fill="#f5f5f8"/>
  <rect width="220" height="720" fill="#0f0f17"/>
  <circle cx="34" cy="34" r="12" fill="#5d63f1"/>
  <text x="56" y="39" fill="#fff" font-size="15" font-weight="600">Client Site</text>
  <g fill="#8e8ea3" font-size="13">
    <text x="24" y="92">Entries</text>
    <text x="24" y="126">Files</text>
    <text x="24" y="160">Members</text>
    <text x="24" y="194">Categories</text>
  </g>
  <rect x="12" y="216" width="196" height="30" rx="5" fill="#26263a"/>
  <text x="24" y="236" fill="#ffffff" font-size="13">Add-ons</text>
  <g fill="#8e8ea3" font-size="13">
    <text x="24" y="280">Settings</text>
  </g>
  <rect x="220" width="980" height="56" fill="#ffffff"/>
  <line x1="220" y1="56" x2="1200" y2="56" stroke="#e4e4ec"/>
  <text x="252" y="35" font-size="16" font-weight="650" fill="#17171c">Edit Entry</text>
  <rect x="252" y="80" width="916" height="440" rx="6" fill="#ffffff" stroke="#e4e4ec"/>
  <text x="276" y="122" font-size="13" fill="#5d63f1" font-weight="600">Publish</text>
  <rect x="276" y="132" width="52" height="2" fill="#5d63f1"/>
  <text x="355.8" y="122" font-size="13" fill="#6b6b80">Content</text>
  <text x="435.6" y="122" font-size="13" fill="#6b6b80">Content SE</text>
  <text x="537.6" y="122" font-size="13" fill="#6b6b80">Content DE</text>
  <text x="639.6" y="122" font-size="13" fill="#6b6b80">Date</text>
  <text x="697.2" y="122" font-size="13" fill="#6b6b80">Categories</text>
  <text x="799.2" y="122" font-size="13" fill="#6b6b80">Options</text>
  <line x1="276" y1="134" x2="1144" y2="134" stroke="#e4e4ec"/>
  <line x1="276" y1="134" x2="328" y2="134" stroke="#5d63f1" stroke-width="2"/>
  <text x="276" y="174" font-size="12" font-weight="600" fill="#17171c">Title</text>
  <rect x="276" y="184" width="575" height="36" rx="5" fill="#ffffff" stroke="#d9d9e3"/>
  <text x="863" y="174" font-size="12" font-weight="600" fill="#17171c">URL title</text>
  <rect x="863" y="184" width="281" height="36" rx="5" fill="#ffffff" stroke="#d9d9e3"/>
  <text x="276" y="252" font-size="11" font-weight="650" letter-spacing=".7" fill="#6b6b80">CONTACT DETAILS</text>
  <line x1="400" y1="248" x2="1144" y2="248" stroke="#dfe0ef"/>
  <text x="276" y="286" font-size="12" font-weight="600" fill="#17171c">Phone</text>
  <rect x="276" y="296" width="208" height="36" rx="5" fill="#ffffff" stroke="#d9d9e3"/>
  <text x="496" y="286" font-size="12" font-weight="600" fill="#17171c">Email</text>
  <rect x="496" y="296" width="428" height="36" rx="5" fill="#ffffff" stroke="#d9d9e3"/>
  <text x="936" y="286" font-size="12" font-weight="600" fill="#17171c">Postcode</text>
  <rect x="936" y="296" width="208" height="36" rx="5" fill="#ffffff" stroke="#d9d9e3"/>
  <text x="276" y="364" font-size="11" font-weight="650" letter-spacing=".7" fill="#6b6b80">CONTENT</text>
  <line x1="339" y1="360" x2="1144" y2="360" stroke="#dfe0ef"/>
  <text x="276" y="398" font-size="12" font-weight="600" fill="#17171c">Intro</text>
  <rect x="276" y="408" width="428" height="64" rx="5" fill="#ffffff" stroke="#d9d9e3"/>
  <text x="716" y="398" font-size="12" font-weight="600" fill="#17171c">Hero image</text>
  <rect x="716" y="408" width="428" height="64" rx="5" fill="#ffffff" stroke="#d9d9e3"/>
  <text x="732" y="446" font-size="12" fill="#8b8b98">Choose existing</text>
</svg>
